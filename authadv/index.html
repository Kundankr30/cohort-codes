<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
<link rel="icon" href="icons8-favorite-16.png" type="image/x-icon">

    
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.11.0/axios.min.js"></script>
<script>
   async function signup(){
        const usernmae  = document.getElementById("signup-username").value;
        const password = document.getElementById("signup-password").value;
        await axios.post("http://localhost:3000/signup",{
            username:usernmae,
            password:password
        });   

        alert("You are signed up");
    }

async function signin(){
    const username = document.getElementById("signin-username").value;
    const password = document.getElementById("signin-password").value;
    const response = await axios.post("http://localhost:3000/signin",{
        username:username,
        password:password
    })
    //local storage stores the token 
    localStorage.setItem("token",response.data.token);
    alert("You are signed in"); 
    
}

        async function getUserInformation() {
            const token = localStorage.getItem("token");
            try {
                const response = await axios.get("http://localhost:3000/me", {
                    headers: { token: token }
                });
                const user = response.data;
                document.getElementById("profile-info").innerHTML = `<b>Username:</b> ${user.username}`;
            } 
            catch (error) {
                console.error("Failed to fetch user info:", error);
                document.getElementById("profile-info").innerHTML = "Could not load profile. Your session may be invalid.";
            }
        }
        getUserInformation();
   
    
</script>
<body>
   <div>
    Sign up
    <input id="signup-username"type="text" name ="username" placeholder="username">
    <input id="signup-password" type="password" name="password" placeholder="password">
    <button onclick="signup()">Submit</button>
   </div> 
   <div>
    Sign in
    <input id="signin-username"type="text" name ="username" placeholder="username">
    <input id="signin-password"type="password" name="password" placeholder="password">
    <button onclick="signin()">Submit</button>
   </div> 
   <div>
    User information:
    <div id="information">Loading user data...</div>
   </div>
   <div>
    <button onclick="logout()">Logout</button>
   </div>
</body>
</html>
